<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 작성/수정</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .field { margin: 10px 0; width: 100%; padding: 5px; }
        .task-group { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .remove-task { background-color: red; color: white; border: none; padding: 5px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="wrap">
    <h2 id="pageTitle">📁 프로젝트 작성하기</h2>

    <label>프로젝트명:</label>
    <input type="text" id="projectName" class="field">

    <label>설명:</label>
    <textarea id="description" class="field"></textarea>

    <label>시작일:</label>
    <input type="date" id="startDate" class="field">

    <label>종료일:</label>
    <input type="date" id="endDate" class="field">

    <h3>📝 작업(Task) 목록</h3>
    <div id="taskContainer"></div>
    <button onclick="addTask()">작업 추가</button>

    <br><br>
    <button onclick="submitProject()">저장</button>
    <button onclick="goBack()">취소</button>
</div>

<script>
    const projectId = new URLSearchParams(window.location.search).get('id');
    let taskIndex = 0;
    const tasksMeta = [];

    $(document).ready(function() {
        // 수정 모드일 때 기존 데이터 로드
        if (projectId) {
            $('#pageTitle').text("✏ 프로젝트 수정하기");
            $.getJSON(`/api/projects/${projectId}`, data => {
                $('#projectName').val(data.projectName);
                $('#description').val(data.description);
                $('#startDate').val(data.startDate);
                $('#endDate').val(data.endDate);
                // 기존 Task 렌더
                data.tasks.forEach((t, idx) => addTask(t, idx));
            }).fail(() => alert("❌ 프로젝트 정보를 불러오지 못했습니다."));
        } else {
            addTask();
        }
    });

    // 부모 Task endDate 변경 시 자식 재계산
    $(document).on('change', '.endDate', function() {
        const changed = +$(this).closest('.task-group').data('id');
        $('.task-group').each(function() {
            const me = $(this), id = +me.data('id');
            if (me.find(`.predecessor[data-id="${changed}"]`).is(':checked')) {
                validateStartDate(id);
            }
        });
    });

    // 선행 checkbox 변경 시 gap input 다시 그리고 재계산
    $(document).on('change', '.predecessor', function() {
        const id = +$(this).closest('.task-group').data('id');
        updateGapInputs(id);
    });

    function addTask(task = {}, forcedIndex = null) {
        const id = forcedIndex != null ? forcedIndex : taskIndex++;
        const label = `#${id+1}`;
        // 이전에 만든 task 의 id,label 로 체크박스 옵션 구성
        const options = tasksMeta.map(t =>
            `<label>
                <input type="checkbox" class="predecessor" data-id="${t.id}"> ${t.label}
            </label>`
        ).join('<br>');

        $('#taskContainer').append(`
            <div class="task-group" data-id="${id}">
              <h4>${label}</h4>
              <label>작업명:</label>
              <input type="text" class="taskName field" value="${task.taskName||''}">
              <label>담당자:</label>
              <input type="text" class="assignedTo field" value="${task.assignedTo||''}">
              <label>시작일:</label>
              <input type="date" class="startDate field" value="${task.startDate||''}">
              <label>종료일:</label>
              <input type="date" class="endDate field" value="${task.endDate||''}">
              <div class="predecessor-box">
                <p>선행 작업 선택 + gap 입력 (일)</p>
                ${options}
                <div class="gap-container" id="gapContainer-${id}"></div>
              </div>
              <button class="remove-task" onclick="removeTask(${id})">❌ 삭제</button>
            </div>
        `);

        tasksMeta.push({id, label});

        // 수정 모드: 기존 Predecessor & gap 채우기
        setTimeout(() => {
            if (task.predecessorIds && task.gaps) {
                const gapsMap = {};
                task.predecessorIds.forEach((pre, i) => {
                    gapsMap[pre] = task.gaps[i];
                    $(`.task-group[data-id="${id}"] .predecessor[data-id="${pre}"]`).prop('checked', true);
                });
                updateGapInputs(id, gapsMap);
            }
        }, 0);
    }

    /**
     * @param currentId {number}
     * @param gapsMap {object}  optional, { predecessorId: gapDays, ... }
     */
    function updateGapInputs(currentId, gapsMap = {}) {
        const cont = $(`#gapContainer-${currentId}`).empty();
        $(`.task-group[data-id="${currentId}"] .predecessor:checked`).each(function() {
            const pre = $(this).data('id');
            const val = gapsMap[pre] != null ? gapsMap[pre] : 1;
            cont.append(`
                <label>#${pre+1} 이후 gap(일):</label>
                <input type="number" class="gap" data-pre="${pre}" min="0" value="${val}"><br>
            `);
        });
        // gap 변경 시 재계산
        cont.find('.gap').off('input').on('input', () => validateStartDate(currentId));
        // 체크박스 변경 직후에도 재계산
        validateStartDate(currentId);
    }

    function validateStartDate(taskId) {
        const grp = $(`.task-group[data-id="${taskId}"]`);
        let maxDate = null;
        grp.find('.predecessor:checked').each(function() {
            const pre = $(this).data('id');
            const end = new Date($(`.task-group[data-id="${pre}"] .endDate`).val());
            const gap = parseInt(grp.find(`.gap[data-pre="${pre}"]`).val())||0;
            end.setDate(end.getDate()+gap);
            if (!maxDate || end > maxDate) maxDate = end;
        });
        if (maxDate) {
            const si = grp.find('.startDate')[0],
                ei = grp.find('.endDate')[0],
                dur = (new Date(ei.value)-new Date(si.value))/(1000*60*60*24),
                minStr = maxDate.toISOString().slice(0,10);
            si.min = minStr;
            if (new Date(si.value) < maxDate) {
                si.value = minStr;
                const ne = new Date(si.value);
                ne.setDate(ne.getDate() + (isNaN(dur)?1:dur));
                ei.value = ne.toISOString().slice(0,10);
            }
        }
    }

    function removeTask(id) {
        $(`.task-group[data-id="${id}"]`).remove();
    }

    function submitProject() {
        const body = {
            projectName: $('#projectName').val().trim(),
            description: $('#description').val().trim(),
            startDate: $('#startDate').val(),
            endDate: $('#endDate').val(),
            tasks: []
        };
        $('.task-group').each(function() {
            const $g = $(this), id = +$g.data('id');
            const t = {
                taskName: $g.find('.taskName').val(),
                assignedTo: $g.find('.assignedTo').val(),
                startDate: $g.find('.startDate').val(),
                endDate: $g.find('.endDate').val(),
                predecessorIds: [], gaps: []
            };
            $g.find('.predecessor:checked').each(function() {
                const pre = +$(this).data('id');
                t.predecessorIds.push(pre);
                t.gaps.push(+$g.find(`.gap[data-pre="${pre}"]`).val()||0);
            });
            body.tasks.push(t);
        });
        if (!body.projectName||!body.startDate||!body.endDate) {
            return alert("프로젝트명/시작일/종료일을 모두 입력해주세요.");
        }
        $.ajax({
            url: projectId ? `/api/projects/${projectId}` : '/api/projects',
            type: projectId ? 'PUT' : 'POST',
            contentType: 'application/json',
            data: JSON.stringify(body),
            success: () => {
                alert('✅ 저장되었습니다');
                if (projectId) {
                    // 수정 모드 → 상세 페이지로 돌아가기
                    location.href = `project_detail.html?id=${projectId}`;
                } else {
                    // 새로 만들기 모드 → 목록으로
                    location.href = 'index.html';
                }
            },
            error: () => alert('❌ 저장 중 오류 발생')
        });
    }



    function goBack() {
        if (projectId) {
            // 수정 모드 → 상세 페이지로 돌아가기
            location.href = `project_detail.html?id=${projectId}`;
        } else {
            // 새로 만들기 모드 → 목록으로
            location.href = 'index.html';
        }
    }
</script>
</body>
</html>
