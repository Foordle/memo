<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 작성/수정</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .field { margin: 10px 0; width: 100%; padding: 5px; }
        .task-group { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .remove-task { background-color: red; color: white; border: none; padding: 5px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="wrap">
    <h2 id="pageTitle">📁 프로젝트 작성하기</h2>

    <label>프로젝트명:</label>
    <input type="text" id="projectName" class="field">

    <label>설명:</label>
    <textarea id="description" class="field"></textarea>

    <label>시작일:</label>
    <input type="date" id="startDate" class="field">

    <label>종료일:</label>
    <input type="date" id="endDate" class="field">

    <h3>📝 작업(Task) 목록</h3>
    <div id="taskContainer"></div>
    <button onclick="addTask()">작업 추가</button>

    <br><br>
    <button onclick="submitProject()">저장</button>
    <button onclick="goBack()">취소</button>
</div>

<script>
    const projectId = new URLSearchParams(window.location.search).get('id');

    $(document).ready(function () {
        if (projectId) {
            $('#pageTitle').text("✏ 프로젝트 수정하기");

            $.ajax({
                type: 'GET',
                url: `/api/projects/${projectId}`,
                success: function (data) {
                    $('#projectName').val(data.projectName);
                    $('#description').val(data.description);
                    $('#startDate').val(data.startDate);
                    $('#endDate').val(data.endDate);

                    if (data.tasks) {
                        data.tasks.forEach(task => {
                            addTask(task);
                        });
                    }
                },
                error: function () {
                    alert("❌ 프로젝트 정보를 불러오지 못했습니다.");
                }
            });
        } else {
            addTask(); // 빈 작업 필드 1개 추가
        }
    });

    function addTask(task = {}) {
        const taskId = new Date().getTime();  // 고유 id
        $('#taskContainer').append(`
            <div class="task-group" data-id="${taskId}">
                <label>작업명:</label>
                <input type="text" class="taskName field" value="${task.taskName || ''}">
                <label>담당자:</label>
                <input type="text" class="assignedTo field" value="${task.assignedTo || ''}">
                <label>시작일:</label>
                <input type="date" class="startDate field" value="${task.startDate || ''}">
                <label>종료일:</label>
                <input type="date" class="endDate field" value="${task.endDate || ''}">
                <button class="remove-task" onclick="removeTask(${taskId})">❌ 삭제</button>
            </div>
        `);
    }

    function removeTask(id) {
        $(`.task-group[data-id='${id}']`).remove();
    }

    function submitProject() {
        const data = {
            projectName: $('#projectName').val().trim(),
            description: $('#description').val().trim(),
            startDate: $('#startDate').val(),
            endDate: $('#endDate').val(),
            tasks: []
        };

        $('.task-group').each(function () {
            const task = {
                taskName: $(this).find('.taskName').val(),
                assignedTo: $(this).find('.assignedTo').val(),
                startDate: $(this).find('.startDate').val(),
                endDate: $(this).find('.endDate').val()
            };
            data.tasks.push(task);
        });

        if (!data.projectName || !data.startDate || !data.endDate) {
            alert("프로젝트명, 시작일, 종료일을 모두 입력해주세요.");
            return;
        }

        const method = projectId ? 'PUT' : 'POST';
        const url = projectId ? `/api/projects/${projectId}` : '/api/projects';

        $.ajax({
            type: method,
            url: url,
            data: JSON.stringify(data),
            contentType: 'application/json',
            success: function () {
                alert('✅ 프로젝트가 저장되었습니다.');
                window.location.href = 'index.html';
            },
            error: function () {
                alert('❌ 저장 중 오류 발생');
            }
        });
    }

    function goBack() {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
