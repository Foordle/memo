<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 작성/수정</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .field { margin: 10px 0; width: 100%; padding: 5px; }
        .task-group { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .remove-task { background-color: red; color: white; border: none; padding: 5px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="wrap">
    <h2 id="pageTitle">📁 프로젝트 작성하기</h2>

    <label>프로젝트명:</label>
    <input type="text" id="projectName" class="field">

    <label>설명:</label>
    <textarea id="description" class="field"></textarea>

    <label>시작일:</label>
    <input type="date" id="startDate" class="field">

    <label>종료일:</label>
    <input type="date" id="endDate" class="field">

    <h3>📝 작업(Task) 목록</h3>
    <div id="taskContainer"></div>
    <button onclick="addTask()">작업 추가</button>

    <br><br>
    <button onclick="submitProject()">저장</button>
    <button onclick="goBack()">취소</button>
</div>

<script>
    const projectId = new URLSearchParams(window.location.search).get('id');
    let taskIndex = 0;
    const tasksMeta = [];

    $(document).ready(function () {
        if (projectId) {
            $('#pageTitle').text("✏ 프로젝트 수정하기");

            $.ajax({
                type: 'GET',
                url: `/api/projects/${projectId}`,
                success: function (data) {
                    $('#projectName').val(data.projectName);
                    $('#description').val(data.description);
                    $('#startDate').val(data.startDate);
                    $('#endDate').val(data.endDate);

                    if (data.tasks) {
                        data.tasks.forEach((task, idx) => {
                            addTask(task, idx);
                        });
                    }
                },
                error: function () {
                    alert("❌ 프로젝트 정보를 불러오지 못했습니다.");
                }
            });
        } else {
            addTask();
        }
    });

    function addTask(task = {}, forcedIndex = null) {
        const taskId = forcedIndex !== null ? forcedIndex : taskIndex++;
        const label = `#${taskId + 1}`;

        const predecessorOptions = tasksMeta.map(t => {
            return `
                <label>
                    <input type="checkbox" class="predecessor" data-id="${t.id}" onchange="updateGapInputs(${taskId})"> ${t.label}
                </label>
            `;
        }).join('<br>');

        $('#taskContainer').append(`
            <div class="task-group" data-id="${taskId}">
                <h4>${label}</h4>
                <label>작업명:</label>
                <input type="text" class="taskName field" value="${task.taskName || ''}">
                <label>담당자:</label>
                <input type="text" class="assignedTo field" value="${task.assignedTo || ''}">
                <label>시작일:</label>
                <input type="date" class="startDate field" value="${task.startDate || ''}" onchange="validateStartDate(${taskId})">
                <label>종료일:</label>
                <input type="date" class="endDate field" value="${task.endDate || ''}">

                <div class="predecessor-box">
                    <p>선행 작업 선택 + gap 입력 (일)</p>
                    ${predecessorOptions}
                    <div class="gap-container" id="gapContainer-${taskId}"></div>
                </div>

                <button class="remove-task" onclick="removeTask(${taskId})">❌ 삭제</button>
            </div>
        `);

        tasksMeta.push({ id: taskId, label: label, name: task.taskName || '' });

        setTimeout(() => {
            if (task.predecessorIds && task.gaps) {
                // 체크박스 강제 체크
                task.predecessorIds.forEach(preId => {
                    $(`.task-group[data-id='${taskId}'] .predecessor[data-id='${preId}']`).prop('checked', true);
                });

                // gap input 박스 렌더링 후 값 설정
                updateGapInputs(taskId);

                for (let i = 0; i < task.predecessorIds.length; i++) {
                    const preId = task.predecessorIds[i];
                    const gapVal = task.gaps[i];
                    $(`.task-group[data-id='${taskId}'] .gap[data-pre='${preId}']`).val(gapVal);
                }
            }
        }, 0);

    }

    function updateGapInputs(currentId) {
        const container = $(`#gapContainer-${currentId}`);
        container.empty();

        $(`.task-group[data-id="${currentId}"] .predecessor:checked`).each(function () {
            const id = $(this).data('id');
            container.append(`
                <label>#${id + 1} 이후 gap(일):</label>
                <input type="number" class="gap" data-pre="${id}" min="0" value="1"><br>
            `);
        });
    }

    function validateStartDate(taskId) {
        const taskEl = $(`.task-group[data-id="${taskId}"]`);
        const checkedPre = taskEl.find('.predecessor:checked');
        let maxStart = null;

        checkedPre.each(function () {
            const preId = $(this).data('id');
            const preTaskEl = $(`.task-group[data-id="${preId}"]`);
            const preEnd = new Date(preTaskEl.find('.endDate').val());
            const gap = parseInt(taskEl.find(`.gap[data-pre="${preId}"]`).val()) || 0;

            let minDate = new Date(preEnd);
            minDate.setDate(minDate.getDate() + gap);

            if (!maxStart || minDate > maxStart) {
                maxStart = minDate;
            }
        });

        if (maxStart) {
            const startInput = taskEl.find('.startDate')[0];
            const endInput = taskEl.find('.endDate')[0];
            const currentDuration = (new Date(endInput.value) - new Date(startInput.value)) / (1000 * 60 * 60 * 24);

            startInput.min = maxStart.toISOString().split("T")[0];
            if (new Date(startInput.value) < maxStart) {
                startInput.value = startInput.min;
                const newEnd = new Date(startInput.value);
                newEnd.setDate(newEnd.getDate() + (isNaN(currentDuration) ? 1 : currentDuration));
                endInput.value = newEnd.toISOString().split("T")[0];
            }
        }
    }

    function removeTask(id) {
        $(`.task-group[data-id='${id}']`).remove();
    }

    function submitProject() {
        const data = {
            projectName: $('#projectName').val().trim(),
            description: $('#description').val().trim(),
            startDate: $('#startDate').val(),
            endDate: $('#endDate').val(),
            tasks: []
        };

        $('.task-group').each(function () {
            const id = parseInt($(this).data('id'));
            const task = {
                taskName: $(this).find('.taskName').val(),
                assignedTo: $(this).find('.assignedTo').val(),
                startDate: $(this).find('.startDate').val(),
                endDate: $(this).find('.endDate').val(),
                predecessorIds: [],
                gaps: []
            };

            $(this).find('.predecessor:checked').each(function () {
                const preId = parseInt($(this).data('id'));
                const gap = parseInt($(this).closest('.task-group').find(`.gap[data-pre="${preId}"]`).val()) || 0;
                task.predecessorIds.push(preId);
                task.gaps.push(gap);
            });

            data.tasks.push(task);

            const meta = tasksMeta.find(t => t.id === id);
            if (meta) meta.name = task.taskName;
        });

        if (!data.projectName || !data.startDate || !data.endDate) {
            alert("프로젝트명, 시작일, 종료일을 모두 입력해주세요.");
            return;
        }

        const method = projectId ? 'PUT' : 'POST';
        const url = projectId ? `/api/projects/${projectId}` : '/api/projects';

        $.ajax({
            type: method,
            url: url,
            data: JSON.stringify(data),
            contentType: 'application/json',
            success: function () {
                alert('✅ 프로젝트가 저장되었습니다.');
                window.location.href = 'index.html';
            },
            error: function () {
                alert('❌ 저장 중 오류 발생');
            }
        });
    }

    function goBack() {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
