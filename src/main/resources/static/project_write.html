<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 생성</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrap">
    <h2>새 프로젝트 생성</h2>

    <label for="projectName">프로젝트 이름:</label>
    <input type="text" id="projectName" class="field"><br>

    <label for="startDate">시작일:</label>
    <input type="date" id="startDate" class="field"><br>

    <label for="endDate">종료일:</label>
    <input type="date" id="endDate" class="field"><br>

    <label for="description">설명:</label>
    <textarea id="description" class="field"></textarea><br>

    <h3>작업(Task) 목록</h3>
    <div id="tasks-container">
        <div class="task">
            <input type="text" class="field task-name" placeholder="작업(Task) 이름">
            <input type="date" class="field task-start">
            <input type="date" class="field task-end">
            <input type="text" class="field task-assigned" placeholder="담당자">
        </div>
    </div>
    <button onclick="addTask()">작업 추가</button>

    <button onclick="submitProject()">프로젝트 저장</button>
    <button onclick="goBack()">취소</button>
</div>

<script>
    function addTask() {
        $('#tasks-container').append(`
            <div class="task">
                <input type="text" class="field task-name" placeholder="작업(Task) 이름">
                <input type="date" class="field task-start">
                <input type="date" class="field task-end">
                <input type="text" class="field task-assigned" placeholder="담당자">
                <button onclick="removeTask(this)">삭제</button>
            </div>
        `);
    }

    function removeTask(button) {
        $(button).parent().remove();
    }

    function submitProject() {
        const projectName = $('#projectName').val();
        const startDate = $('#startDate').val();
        const endDate = $('#endDate').val();
        const description = $('#description').val();
        const tasks = [];

        $('.task').each(function () {
            const taskName = $(this).find('.task-name').val();
            const taskStart = $(this).find('.task-start').val();
            const taskEnd = $(this).find('.task-end').val();
            const assignedTo = $(this).find('.task-assigned').val();

            if (taskName && taskStart && taskEnd && assignedTo) {
                tasks.push({
                    taskName: taskName,
                    startDate: taskStart,
                    endDate: taskEnd,
                    assignedTo: assignedTo
                });
            }
        });

        if (!projectName || !startDate || !endDate || tasks.length === 0) {
            alert('모든 필수 항목을 입력해주세요.');
            return;
        }

        const projectData = {
            projectName: projectName,
            startDate: startDate,
            endDate: endDate,
            description: description,
            tasks: tasks
        };

        $.ajax({
            type: 'POST',
            url: '/api/projects',
            contentType: 'application/json; charset=UTF-8',
            data: JSON.stringify(projectData),
            success: function () {
                alert('프로젝트가 저장되었습니다.');
                window.location.href = 'index.html';
            },
            error: function () {
                alert('프로젝트 저장 중 오류가 발생했습니다.');
            }
        });
    }

    function goBack() {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
