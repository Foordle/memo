<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h2>프로젝트 업무 스케줄 관리</h2>

<button id="scheduleDetailBtn">스케줄 상세 보기</button>

<div id="cards-box"></div>

<script>
    $(document).ready(function () {
        $('#scheduleDetailBtn').click(function () {
            window.location.href = 'project_schedule.html';
        });

        getMessages();
    });

    function getMessages() {
        $('#cards-box').empty();
        $.ajax({
            type: 'GET',
            url: '/api/memos',
            success: function (response) {
                response.forEach(memo => {
                    $('#cards-box').append(`
                            <div class="card" onclick="window.location.href='detail.html?id=${memo.id}'">
                                <h3>${memo.title}</h3>
                            </div>
                        `);
                });
            }
        });
    }
</script>
</body>
</html>
