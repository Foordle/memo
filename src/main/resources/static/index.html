<div class="wrap" id="auth-div" style="display:none;">

    <form action="/login" method="post">
        <h1 class="h3 mb-3 fw-normal">Please sign in</h1>
        <div class="form-floating">
            <input type="text" class="form-control" id="username" placeholder="Your id" name="username" required>
            <label for="username">Your id</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="password" placeholder="Password" name="password" required>
            <label for="password">Password</label>
        </div>
        <div class="form-check text-start my-3">
            <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
            <label class="form-check-label" for="checkDefault">
                Remember me
            </label>
        </div>`
        <button class="btn btn-primary w-100 py-2" id="loginBtn" type="submit">Login</button>
        <a href="/register.html" id="registerBtn" style="display: none;">Sign up</a>
        <a href="/logout" id="logoutBtn" style="display: none;">Logout</a>
