<!DOCTYPE html>
<html lang="ko">
<head>

</head>

<div class="background-header"></div>

<form action="/login" method="post">
    <div class="form-group">
        <label for="username">아이디:</label>
        <input type="text" id="username" name="username" required>
    </div>

    <div class="form-group">
        <label for="password">비밀번호:</label>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit" id="loginBtn">로그인</button>
</form>
</div>

<div class = "wrap">
    <a href="/register.html" id = "registerBtn" style="display: none;">회원가입</a>
    <a href="/logout" id="logoutBtn" style="display: none;">로그아웃</a>
</div>

<div class="wrap">
    <div class="header">
        <h2>게시글 및 프로젝트 관리</h2>
        <p>공유하고 싶은 소식과 프로젝트를 입력해주세요.</p>
    </div>
    <a href="cardList.html">📘게시글 목록 보기</a>

    <a href="projectList.html">📘 프로젝트 목록 보기</a>

</div>

</html>
