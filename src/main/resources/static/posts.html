<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
    <h2>📄 게시글 목록</h2>
    <div id="cards-box"></div>
    <button onclick="window.location.href='index.html'">돌아가기</button>
</div>


<script>
    $(document).ready(function () {
        getMessages();
    });

    function getMessages() {
        $('#cards-box').empty();
        $.ajax({
            type: 'GET',
            url: '/api/memos',
            success: function (response) {
                response.forEach(memo => {
                    $('#cards-box').append(`
                        <div class="card" onclick="window.location.href='detail.html?id=${memo.id}'">
                            <h3>${memo.title}</h3>
                        </div>
                    `);
                });
            }
        });
    }
</script>
</body>
</html>
