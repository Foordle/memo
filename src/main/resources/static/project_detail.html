<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 일정 상세보기</title>

    <!-- ✅ jQuery 로드 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="/fullcalendar-6.1.14/dist/fullcalendar.min.css">
    <script src="/fullcalendar-6.1.14/dist/index.global.js"></script>

    <style>
        #calendar { max-width: 900px; margin: 40px auto; }
        .d-day { font-size: 1.2em; font-weight: bold; color: red; }
        .delete-btn { background-color: red; color: white; padding: 8px; margin-top: 10px; }
        .back-btn { background-color: gray; color: white; padding: 8px; }
    </style>
</head>
<body>

<h2>📌 프로젝트 일정 상세보기</h2>
<div><label>프로젝트 이름:</label> <span id="projectName"></span></div>
<div><label>📄 설명:</label> <span id="projectDescription"></span></div>
<div><label>📅 시작 날짜:</label> <span id="projectStart"></span></div>
<div><label>⏳ 종료 날짜:</label> <span id="projectEnd"></span> <span class="d-day" id="dDay"></span></div>

<h3>📝 작업 목록</h3>
<ul id="taskList"></ul>

<h3>📅 캘린더</h3>
<div id="calendar"></div>

<button class="delete-btn" onclick="deleteProject()">🗑 프로젝트 삭제</button>
<button class="delete-btn" onclick="goToEditPage()">🗑 프로젝트 수정</button>
<button class="back-btn" onclick="goBack()">🔙 목록으로</button>

<script>
    $(document).ready(function() {
        console.log("✅ jQuery 로드 완료");

        const projectId = new URLSearchParams(window.location.search).get('id');

        if (!projectId) {
            alert("잘못된 접근입니다.");
            window.location.href = 'index.html';
            return;
        }

        $.ajax({
            type: 'GET',
            url: `/api/projects/${projectId}`,
            contentType: 'application/json; charset=UTF-8',
            success: function (data) {
                console.log("✅ 프로젝트 데이터 수신:", data);

                $('#projectName').text(data.projectName);
                $('#projectDescription').text(data.description);
                $('#projectStart').text(data.startDate);
                $('#projectEnd').text(data.endDate);

                displayDday(data.endDate);

                $('#taskList').empty();

                if (data.tasks && data.tasks.length > 0) {
                    data.tasks.forEach(task => {
                        $('#taskList').append(`
                            <li>
                                ${task.taskName} (담당자: ${task.assignedTo}, ${task.startDate} ~ ${task.endDate})
                                <button onclick="deleteTask(${task.id})" style="margin-left: 10px;">task완료!(구성원에게 알람 전송!)</button>
                            </li>
                        `);
                    });
                } else {
                    $('#taskList').append('<li>등록된 작업이 없습니다.</li>');
                }

                renderCalendar(data.startDate, data.endDate, data.tasks || []);
            },
            error: function (xhr) {
                alert('❌ 프로젝트 정보를 불러오는 중 오류가 발생했습니다.');
                console.error("🚨 AJAX 오류:", xhr.responseText);
            }
        });
    });

    function renderCalendar(startDate, endDate, tasks) {
        var colors = ['#FF5733', '#33FF57', '#3357FF', '#FF33B5', '#FF8333', '#FF3386', '#33FFF6'];
        var events = [];

        // 프로젝트 시작 및 종료 표시
        events.push({
            title: '프로젝트 시작',
            start: startDate,
            color: 'green'
        });

        events.push({
            title: '프로젝트 종료',
            start: endDate,
            color: 'red'
        });

        // Task 표시
        tasks.forEach((task, index) => {
            var randomColor = colors[index % colors.length];
            events.push({
                title: task.taskName,
                start: task.startDate,
                end: task.endDate,
                color: randomColor
            });
        });

        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'ko',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listWeek'
            },
            events: events
        });

        calendar.render();
    }

    function displayDday(endDate) {
        let today = new Date();
        let end = new Date(endDate);
        let diff = Math.ceil((end - today) / (1000 * 60 * 60 * 24));

        if (diff > 0) {
            $('#dDay').text(` (D-${diff})`);
        } else if (diff === 0) {
            $('#dDay').text(` (D-Day)`);
        } else {
            $('#dDay').text(` (D+${Math.abs(diff)})`);
        }
    }

    function deleteProject() {
        const projectId = new URLSearchParams(window.location.search).get('id');

        if (confirm("정말로 이 프로젝트를 삭제하시겠습니까?")) {
            $.ajax({
                type: 'DELETE',
                url: `/api/projects/${projectId}`,
                success: function () {
                    alert('✅ 프로젝트가 삭제되었습니다.');
                    window.location.href = 'index.html';
                },
                error: function () {
                    alert('❌ 프로젝트 삭제 중 오류가 발생했습니다.');
                }
            });
        }
    }

    function goToEditPage() {
        const projectId = new URLSearchParams(window.location.search).get('id');
        window.location.href = `project_write.html?id=${projectId}`;
    }


    function goBack() {
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
